# Compila o NexTune para Windows nos servidores do GitHub.
# - job build (token só de leitura, sem credenciais persistidas): a mesma verificação do PC
#   (tools/ci-local.ps1: BOM, PSScriptAnalyzer, Pester, checagens da interface, clippy, cargo test)
#   num passo sem segredo nenhum, e o build do instalador em outro; a chave de assinatura entra só
#   nesse segundo passo e só em tag v*. Guarda instalador + SHA256.txt (+ .sig em tag) e o Cargo.lock
#   como artefatos.
# - job publicar (token com escrita; roda só código deste workflow): em main, se o build passou,
#   commita o Cargo.lock que ele regenerou (não há Rust na máquina de desenvolvimento), depois de
#   conferir que todas as fontes são o crates.io; em tag v*, cria a Release como RASCUNHO com
#   instalador, .sig, latest.json e SHA256.txt. Publicar é manual, depois do checklist da spec (13).
# Ações de terceiros fixadas por commit (tag/branch anotados ao lado).

name: Compilar NexTune

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '*.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable

      # Cache só fora de tag: o build assinado não reaproveita nada de outros runs.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        if: github.ref_type != 'tag'
        with:
          workspaces: src-tauri

      - name: Instalar Pester e PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Instalar dependências do Node
        run: npm ci

      - name: Conferir que a tag bate com a versão do tauri.conf.json
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $versao = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$versao" -ne $env:GITHUB_REF_NAME) {
            Write-Host "::error::tag $env:GITHUB_REF_NAME, mas tauri.conf.json diz $versao"
            exit 1
          }

      - name: Verificar (lint, testes, clippy, cargo test)
        shell: pwsh
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci-local.ps1 -SoTestes
          exit $LASTEXITCODE

      - name: Guardar o Cargo.lock regenerado
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cargo-lock
          path: src-tauri/Cargo.lock

      - name: Compilar o instalador (assinado em tag)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ github.ref_type == 'tag' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci-local.ps1 -SoBuild -Release
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci-local.ps1 -SoBuild
          }
          exit $LASTEXITCODE

      - name: Calcular SHA-256 do instalador
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          Get-ChildItem $dir -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content "$dir/SHA256.txt"
          Get-Content "$dir/SHA256.txt"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: NexTune-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/SHA256.txt

  publicar:
    needs: build
    if: ${{ needs.build.result == 'success' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: cargo-lock
          path: lock

      - name: Commitar Cargo.lock regenerado
        if: github.ref == 'refs/heads/main'
        run: |
          # O lock vem do job de build (código de terceiros rodou lá): parser TOML de verdade, só pacotes do
          # crates.io (ou sem fonte, o próprio nextune) e nenhuma seção além de version/package.
          python3 - <<'PY'
          import sys, tomllib
          lock = tomllib.load(open('lock/Cargo.lock', 'rb'))
          ok = 'registry+https://github.com/rust-lang/crates.io-index'
          ruins = [p.get('name') for p in lock.get('package', []) if p.get('source', ok) != ok]
          extras = sorted(set(lock) - {'version', 'package'})
          if ruins or extras:
              print(f'::error::Cargo.lock suspeito: fontes {ruins}, seções {extras}'); sys.exit(1)
          PY
          cp lock/Cargo.lock src-tauri/Cargo.lock
          git fetch -q origin main
          if git diff --quiet -- src-tauri/Cargo.lock; then
            echo 'Cargo.lock já está atualizado'
          elif [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "main avançou desde $GITHUB_SHA; o run do commit novo commita o Cargo.lock"
          else
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src-tauri/Cargo.lock
            git commit -m 'chore: Cargo.lock regenerado pelo build do Actions'
            git push
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: github.ref_type == 'tag'
        with:
          name: NexTune-windows
          path: dist

      - name: Criar a Release (rascunho) com latest.json
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $exe = Get-ChildItem dist -Filter *-setup.exe | Select-Object -First 1
          $sig = (Get-Content -Raw "$($exe.FullName).sig").Trim()
          $tag = $env:GITHUB_REF_NAME
          $manifesto = [ordered]@{
            version   = $tag.TrimStart('v')
            notes     = "NexTune $tag"
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{ 'windows-x86_64' = @{ signature = $sig; url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($exe.Name)" } }
          }
          $manifesto | ConvertTo-Json -Depth 4 | Set-Content dist/latest.json -Encoding utf8
          Get-Content dist/latest.json
          gh release create $tag --draft --generate-notes --title "NexTune $tag" "$($exe.FullName)" "$($exe.FullName).sig" dist/latest.json dist/SHA256.txt
