# Compila o Otimizador para Windows nos servidores do GitHub.
# - A cada push em main, em tags de versão (v*) ou manualmente: roda a mesma
#   verificação do PC (tools/ci-local.ps1: BOM, PSScriptAnalyzer, Pester,
#   checagens da interface, clippy, cargo test, build e limite de tamanho do
#   instalador) e guarda o instalador + SHA256.txt como artefato na aba "Actions".
# - Não publica Release: isso fica para o Plano 6 (depende da conta GitHub e da
#   chave do atualizador).

name: Compilar Otimizador

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar Pester e PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Instalar dependências do Node
        run: npm ci

      - name: Verificar e compilar (lint, testes, build e tamanho)
        shell: pwsh
        run: powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci-local.ps1

      - name: Calcular SHA-256 do instalador
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          Get-ChildItem $dir -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content "$dir/SHA256.txt"
          Get-Content "$dir/SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: Otimizador-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/SHA256.txt
