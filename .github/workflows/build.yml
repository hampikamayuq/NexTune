# Compila o NexTune para Windows nos servidores do GitHub.
# - A cada push em main ou manualmente: roda a mesma verificação do PC (tools/ci-local.ps1: BOM,
#   PSScriptAnalyzer, Pester, checagens da interface, clippy, cargo test, build e limite de tamanho
#   do instalador), guarda o instalador + SHA256.txt como artefato na aba "Actions" e, se o build
#   regenerou o Cargo.lock (não há Rust na máquina de desenvolvimento), commita ele em main.
# - Em tag v*: o mesmo, com os artefatos assinados do atualizador (secret TAURI_SIGNING_PRIVATE_KEY),
#   e cria a Release como RASCUNHO com instalador, .sig, latest.json e SHA256.txt. Publicar é manual,
#   depois do checklist da spec (seção 13).

name: Compilar NexTune

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Instalar Pester e PSScriptAnalyzer
        shell: powershell
        run: |
          Install-Module Pester -MinimumVersion 5.5 -Force -SkipPublisherCheck -Scope CurrentUser
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser

      - name: Instalar dependências do Node
        run: npm ci

      - name: Conferir que a tag bate com a versão do tauri.conf.json
        if: github.ref_type == 'tag'
        shell: pwsh
        run: |
          $versao = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ("v$versao" -ne $env:GITHUB_REF_NAME) {
            Write-Host "::error::tag $env:GITHUB_REF_NAME, mas tauri.conf.json diz $versao"
            exit 1
          }

      - name: Verificar e compilar (lint, testes, build e tamanho)
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci-local.ps1 -Release
          } else {
            powershell -NoProfile -ExecutionPolicy Bypass -File tools/ci-local.ps1
          }
          exit $LASTEXITCODE

      - name: Commitar Cargo.lock regenerado
        if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
        shell: pwsh
        run: |
          if (git status --porcelain src-tauri/Cargo.lock) {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add src-tauri/Cargo.lock
            git commit -m 'chore: Cargo.lock regenerado pelo build do Actions'
            git push
          } else {
            Write-Host 'Cargo.lock já está atualizado'
          }

      - name: Calcular SHA-256 do instalador
        shell: pwsh
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          Get-ChildItem $dir -Filter *.exe | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash)  $($_.Name)"
          } | Set-Content "$dir/SHA256.txt"
          Get-Content "$dir/SHA256.txt"

      - uses: actions/upload-artifact@v4
        with:
          name: NexTune-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.sig
            src-tauri/target/release/bundle/nsis/SHA256.txt

      - name: Criar a Release (rascunho) com latest.json
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $dir = 'src-tauri/target/release/bundle/nsis'
          $exe = Get-ChildItem $dir -Filter *-setup.exe | Select-Object -First 1
          $sig = (Get-Content -Raw "$($exe.FullName).sig").Trim()
          $tag = $env:GITHUB_REF_NAME
          $manifesto = [ordered]@{
            version   = $tag.TrimStart('v')
            notes     = "NexTune $tag"
            pub_date  = (Get-Date).ToUniversalTime().ToString('yyyy-MM-ddTHH:mm:ssZ')
            platforms = @{ 'windows-x86_64' = @{ signature = $sig; url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$tag/$($exe.Name)" } }
          }
          $manifesto | ConvertTo-Json -Depth 4 | Set-Content "$dir/latest.json" -Encoding utf8
          Get-Content "$dir/latest.json"
          gh release create $tag --draft --generate-notes --title "NexTune $tag" "$($exe.FullName)" "$($exe.FullName).sig" "$dir/latest.json" "$dir/SHA256.txt"
